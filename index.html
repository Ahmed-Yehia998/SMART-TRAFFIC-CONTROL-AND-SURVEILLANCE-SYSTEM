<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Smart Traffic Control & Surveillance System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="login-page">
    <div class="login-bg">
      <div class="grid-overlay"></div>
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
      <div class="network-nodes" id="network-nodes"></div>
    </div>

    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
            <path d="M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h3M19 12h3M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
        </div>
        <h1>Smart Traffic Control</h1>
        <p>Surveillance & Management System</p>
      </div>

      <div class="demo-hint">
        Demo credentials: <strong>admin</strong> / <strong>admin123</strong>
      </div>

      <form class="login-form" id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Username or Email</label>
          <input type="text" id="username" class="form-input" placeholder="Enter your username" autocomplete="username" required>
          <div class="form-error" id="username-error">Please enter a valid username</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required>
          <div class="form-error" id="password-error">Please enter your password</div>
        </div>

        <div class="form-group" style="display:flex;justify-content:space-between;align-items:center;">
          <label class="form-checkbox">
            <input type="checkbox" id="remember">
            Remember me
          </label>
        </div>

        <button type="submit" class="btn btn-primary" id="login-btn">
          <span>Sign In to Dashboard</span>
        </button>
      </form>

      <div class="login-footer">
        Authorized personnel only · University Capstone Project 2026
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Redirect if already logged in
    if (App.isAuthenticated()) {
      window.location.href = 'dashboard.html';
    }

    // Network nodes decoration
    const nodesContainer = document.getElementById('network-nodes');
    for (let i = 0; i < 20; i++) {
      const node = document.createElement('div');
      node.className = 'network-node';
      node.style.left = Math.random() * 100 + '%';
      node.style.top = Math.random() * 100 + '%';
      node.style.animationDelay = Math.random() * 3 + 's';
      nodesContainer.appendChild(node);
    }

    // Form validation & login
    const form = document.getElementById('login-form');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let valid = true;

      // Reset errors
      document.querySelectorAll('.form-error').forEach(el => el.classList.remove('visible'));
      document.querySelectorAll('.form-input').forEach(el => el.classList.remove('error'));

      if (!usernameInput.value.trim()) {
        document.getElementById('username-error').classList.add('visible');
        usernameInput.classList.add('error');
        valid = false;
      }

      if (!passwordInput.value.trim()) {
        document.getElementById('password-error').classList.add('visible');
        passwordInput.classList.add('error');
        valid = false;
      }

      if (!valid) return;

      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      const remember = document.getElementById('remember').checked;

      // Demo auth: admin / admin123
      if ((username === 'admin' || username === 'admin@traffic.local') && password === 'admin123') {
        const btn = document.getElementById('login-btn');
        btn.innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:2px;"></div>';
        btn.disabled = true;

        setTimeout(() => {
          App.login(username === 'admin@traffic.local' ? 'admin' : username, remember);
          window.location.href = 'dashboard.html';
        }, 800);
      } else {
        document.getElementById('password-error').textContent = 'Invalid credentials. Use admin / admin123';
        document.getElementById('password-error').classList.add('visible');
        passwordInput.classList.add('error');
      }
    });
  </script>
</body>
</html>
